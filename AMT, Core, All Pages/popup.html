</select>

<input type="text" value="" id="input__PROXY_REDACTED_" style="width:280px;clear:both;" alt="ex: http://localhost (no trailing slash)">

<br />
Submit "account":
<br />
Submit offsetTime:

<input type="text" value="" id="rACustomKey" style="width:180px;clear:both;"></input>
<br />
<div style="display:inline-block;width:150px;">NextTab Passby: </div>
<input type="button" value="On" id="toggleNTPassBy" style="width:280px;clear:both;"></input>
